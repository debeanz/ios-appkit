# Build the unsigned Steam.app IPA end to end on a macOS runner:
# fetch the client from Valve's CDN, route every system library against the real iOS SDK,
# build the shim (re-exporting the iOS libraries it fronts) + iOS host, run the Mach-O
# surgery, and upload Steam-unsigned.ipa as an artifact. Manual trigger (workflow_dispatch)
# because it pulls ~270 MB and produces a large artifact; the per-push 'build' workflow
# still validates the shim cheaply.
name: ipa

on:
  workflow_dispatch:

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"

      - name: Cache the client packages (~270 MB)
        uses: actions/cache@v4
        with:
          path: .pkgcache
          key: client-pkgs-${{ hashFiles('tools/client-packages.txt') }}

      - name: Fetch + rebuild the macOS client from Valve's CDN
        run: bash tools/fetch-client.sh client .pkgcache

      - name: Route every system library against the iOS SDK
        run: |
          mkdir -p build
          node tools/lib-routes.js client "$(xcrun --sdk iphoneos --show-sdk-path)" \
            data/imports.json data/runtime-gap.json build/routes.json

      - name: Build the shim (AppKitShimCore) and its re-export umbrella (AppKitShim)
        run: |
          make umbrella SDK=device REEXPORT_TBDS="$(jq -r '.reexportTbds | join(" ")' build/routes.json)"
          U=build/device/AppKitShim.framework/AppKitShim
          want=$(( $(jq '.reexportTbds | length' build/routes.json) + 1 ))
          got=$(otool -l "$U" | grep -c LC_REEXPORT_DYLIB)
          echo "umbrella re-exports $got (expected $want: AppKitShimCore + the routed iOS libraries)"
          otool -l "$U" | grep -A2 LC_REEXPORT_DYLIB | grep ' name ' | sed -E 's/^ *name //; s/ \(offset.*//'
          echo "umbrella plain dependencies (should be none):"
          otool -l "$U" | grep -A2 -E 'LC_LOAD_DYLIB$' | grep ' name ' | sed -E 's/^ *name //; s/ \(offset.*//' || true
          [ "$got" -eq "$want" ] || { echo "ERROR: umbrella is missing re-exports"; exit 1; }

      - name: Verify the shim exports what only it can provide
        run: |
          nm -gU build/device/AppKitShimCore.framework/AppKitShimCore > build/shim-exports.txt
          node tools/lib-routes.js --verify build/routes.json build/shim-exports.txt

      - name: Build the iOS host executable
        run: |
          SYSROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun clang -isysroot "$SYSROOT" -target arm64-apple-ios15.0 \
            -fobjc-arc -O2 -Wall -Wno-unused-parameter \
            host/main.m -framework UIKit -framework Foundation \
            -Wl,-rpath,@executable_path/Frameworks \
            -o build/Steam
          file build/Steam

      - name: Package the unsigned IPA
        run: bash tools/package-ipa.sh client build/device build/Steam dist/Steam-unsigned.ipa build/routes.json

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: Steam-unsigned-ipa
          path: dist/Steam-unsigned.ipa
          if-no-files-found: error

      - name: Upload the routing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routing-report
          path: |
            build/routes.json
            build/shim-exports.txt
          if-no-files-found: ignore
