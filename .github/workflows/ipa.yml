# Build the unsigned Steam.app IPA end to end on a macOS runner:
# fetch the client from Valve's CDN, route every system library against the real iOS SDK,
# build the shim (re-exporting the iOS libraries it fronts) + iOS host, run the Mach-O
# surgery, and upload Steam-unsigned.ipa as an artifact. Manual trigger (workflow_dispatch)
# because it pulls ~270 MB and produces a large artifact; the per-push 'build' workflow
# still validates the shim cheaply.
name: ipa

on:
  workflow_dispatch:

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"

      - name: Cache the client packages (~270 MB)
        uses: actions/cache@v4
        with:
          path: .pkgcache
          key: client-pkgs-${{ hashFiles('tools/client-packages.txt') }}

      - name: Fetch + rebuild the macOS client from Valve's CDN
        run: bash tools/fetch-client.sh client .pkgcache

      - name: Reshape the client for iOS (flatten frameworks, drop stale signatures and helpers)
        run: bash tools/prepare-client.sh client

      - name: Route every system library against the iOS SDK
        run: |
          mkdir -p build
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK frameworks that are symlinks: $(find "$SDK/System/Library/Frameworks" -maxdepth 1 -type l | wc -l)"
          ls -la "$SDK/System/Library/Frameworks/AuthenticationServices.framework" "$SDK/System/Library/Frameworks/AuthenticationServices.framework/" 2>&1 | head -8
          node tools/lib-routes.js client "$SDK" data/imports.json data/runtime-gap.json build/routes.json

      - name: Build the shim (AppKitShimCore) and its re-export umbrella (AppKitShim)
        run: |
          make umbrella SDK=device REEXPORT_TBDS="$(jq -r '.reexportTbds | join(" ")' build/routes.json)"
          U=build/device/AppKitShim.framework/AppKitShim
          names() { otool -l "$U" | grep -A2 -E "$1" | grep ' name ' | sed -E 's/^ *name //; s/ \(offset.*//' | sort; }
          names 'LC_REEXPORT_DYLIB$' > build/umbrella-reexports.txt || true
          { echo "@rpath/AppKitShimCore.framework/AppKitShimCore"; jq -r '.reexports[]' build/routes.json; } | sort > build/umbrella-expected.txt
          echo "umbrella re-exports $(wc -l < build/umbrella-reexports.txt) of $(wc -l < build/umbrella-expected.txt) expected:"
          cat build/umbrella-reexports.txt
          missing=$(comm -23 build/umbrella-expected.txt build/umbrella-reexports.txt)
          plain=$(names 'LC_LOAD_DYLIB$' || true)
          [ -z "$plain" ] || { echo "ERROR: umbrella has plain dependencies:"; echo "$plain"; exit 1; }
          [ -z "$missing" ] || { echo "ERROR: re-exports the linker did not write:"; echo "$missing"; exit 1; }

      - name: Verify the shim exports what only it can provide
        run: |
          nm -gU build/device/AppKitShimCore.framework/AppKitShimCore > build/shim-exports.txt
          node tools/lib-routes.js --verify build/routes.json build/shim-exports.txt

      - name: Build the iOS host executable and the launcher interface it loads
        run: |
          SYSROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun clang -isysroot "$SYSROOT" -target arm64-apple-ios15.0 \
            -fobjc-arc -O2 -Wall -Wno-unused-parameter \
            -DHOST_BUILD="\"$(git rev-parse --short HEAD) $(date -u +%Y-%m-%dT%H:%MZ)\"" \
            host/main.m -framework UIKit -framework Foundation \
            -Wl,-rpath,@executable_path/Frameworks \
            -o build/Steam
          file build/Steam
          # steam_osx's exported launcher functions, which steamui/steamclient/vgui2_s
          # look up by name; the host dlopens this RTLD_GLOBAL before any Steam library.
          L=build/device/SteamLauncher.framework
          mkdir -p "$L"
          xcrun clang -isysroot "$SYSROOT" -target arm64-apple-ios15.0 -O2 -Wall -Wno-unused-parameter \
            -dynamiclib -install_name @rpath/SteamLauncher.framework/SteamLauncher \
            host/SteamLauncher.c -o "$L/SteamLauncher"
          sed 's/AppKitShim/SteamLauncher/g' framework/Info.plist > "$L/Info.plist"
          echo "SteamLauncher exports:"; nm -gU "$L/SteamLauncher" | awk '{print "  " $3}'

      - name: Package the unsigned IPA
        run: bash tools/package-ipa.sh client build/device build/Steam dist/Steam-unsigned.ipa build/routes.json

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: Steam-unsigned-ipa
          path: dist/Steam-unsigned.ipa
          if-no-files-found: error

      - name: Upload the routing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routing-report
          path: |
            build/routes.json
            build/shim-exports.txt
          if-no-files-found: ignore
