# Build the unsigned Steam.app IPA end to end on a macOS runner:
# fetch the client from Valve's CDN, build the shim framework + iOS host, run the Mach-O
# surgery, and upload Steam-unsigned.ipa as an artifact. Manual trigger (workflow_dispatch)
# because it pulls ~270 MB and produces a large artifact; the per-push 'build' workflow
# still validates the shim cheaply.
name: ipa

on:
  workflow_dispatch:

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"

      - name: Build the shim framework (device)
        run: make framework SDK=device

      - name: Build the iOS host executable
        run: |
          mkdir -p build
          SYSROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun clang -isysroot "$SYSROOT" -target arm64-apple-ios15.0 \
            -fobjc-arc -O2 -Wall -Wno-unused-parameter \
            host/main.m -framework UIKit -framework Foundation \
            -Wl,-rpath,@executable_path/Frameworks \
            -o build/Steam
          file build/Steam

      - name: Cache the client packages (~270 MB)
        uses: actions/cache@v4
        with:
          path: .pkgcache
          key: client-pkgs-${{ hashFiles('tools/client-packages.txt') }}

      - name: Fetch + rebuild the macOS client from Valve's CDN
        run: bash tools/fetch-client.sh client .pkgcache

      - name: Package the unsigned IPA
        run: bash tools/package-ipa.sh client build/device/AppKitShim.framework build/Steam dist/Steam-unsigned.ipa

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: Steam-unsigned-ipa
          path: dist/Steam-unsigned.ipa
          if-no-files-found: error
